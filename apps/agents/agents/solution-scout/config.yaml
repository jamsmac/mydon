name: solution-scout
business: shared
status: active
description: Поиск готовых open-source решений в публичном GitHub под задачу. Проверяемые ссылки, даты и T1-рекомендация без внедрения.

mission: Найти проверяемое готовое решение и объяснить владельцу, что изучить первым.
non_goals:
  - Не устанавливает найденное решение и не запускает его код.
  - Не покупает подписки и не создаёт внешние аккаунты.
  - Не выдаёт непроверенные каталоги, цены и dependency review за факты.

schedule: [] # по запросу (CLI / Пункт управления); плановый скан — позже

autonomy_default: T1 # разведка, read-only, доклад; внедрение/деньги решает человек

skills:
  - find-solution

# Модель и маршрут задаются единообразно в «Система»; task-mode фиксирует
# exact provider payload/result в Core до итогового checkpoint.
budget:
  per_day_usd: 3.0
  on_exceeded: pause
