name: globerent-service
business: globerent
status: paused
description: Послепродажный сервис HELI — триаж сервисных обращений (запчасти/ТО/гарантия/ремонт) + черновики ответов клиентам.
mission: Принимать и триажировать сервисные обращения по проданной технике HELI (запчасти, ТО, гарантия, ремонт), готовить черновики ответов и назначать мастера — без решений по гарантии, цене и скидкам.
non_goals:
  - НЕ принимает решений по гарантии, цене запчасти/ремонта, скидкам — эскалирует
  - НЕ отправляет ответ клиенту сам — только черновик на кнопку
  - НЕ назначает выезд без подтверждения владельца при стоимости выше порога

# Графики «что когда» (TZ Asia/Tashkent). triage-service — утренний разбор открытых обращений.
schedule:
  - cron: "30 9 * * 1-5"       # будни, утро — триаж открытых сервис-обращений
    skill: triage-service

autonomy_default: T1
break_glass: [draft-service-reply] # деньги/письма клиентам — всегда через согласование (ревизия 04.09.2026)

kb_pages:
  - shared/kb/globerent/heli-models.md
  - shared/kb/globerent/service-criteria.md
  - shared/kb/globerent/faq.md
  - shared/kb/globerent/clients.md

skills:
  - triage-service
  - draft-service-reply
  - service-dispatch        # диспетчер новой сервис-заявки из intake (T2, событие, не cron)

# triage — структурный разбор внутренних данных (можно ollama); draft клиенту — claude-p за качество.
# ВНИМАНИЕ (04.09.2026): поле рантаймом НЕ читается — модель задаёт LLM_MODEL/LLM_FALLBACK_MODELS,
# усилие — `model-effort` во frontmatter llm-навыка. Оставлено как заметка о замысле.
model_routing:
  simple: "ollama"
  complex: "claude-p"
# CLOUD-2: явный дневной потолок трат (safe-default в executor — этот делает его явным/тюнимым)
budget:
  per_day_usd: 3.0
  on_exceeded: pause
