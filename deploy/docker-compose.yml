# MYDON на MYDON/OS (Hetzner + Tailscale).
# Портов наружу не открываем: Core слушает только локально, бот работает
# через long polling. Это требование ТЗ §6.
#
# Запуск:  docker compose -f deploy/docker-compose.yml --env-file .env up -d --build

services:
  mydon-db:
    image: postgres:16-alpine
    container_name: mydon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mydon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-mydon}
      TZ: Asia/Tashkent
    volumes:
      - mydon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mydon} -d ${POSTGRES_DB:-mydon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Наружу не публикуем: доступ только внутри сети compose.

  mydon-core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: mydon:latest
    container_name: mydon-core
    restart: unless-stopped
    depends_on:
      mydon-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Tashkent
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-mydon}:${POSTGRES_PASSWORD}@mydon-db:5432/${POSTGRES_DB:-mydon}
      INGEST_KEY: ${INGEST_KEY:-}
      # Внутренний токен доступа к мутациям Core. Один и тот же у Core и клиентов
      # (панель/бот/агенты). Пусто → ВСЕ мутации отклоняются 401 (fail-closed),
      # Core предупреждает на старте.
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      # Перец для хешей приглашений сотрудников. В БД лежит только хеш кода;
      # без перца 47 бит кода предвычисляются радужной таблицей один раз, и
      # утёкший дамп staff_invite становится пачкой рабочих приглашений.
      # Пусто → Core поднимется (обновление не должно ронять живой сервер),
      # но предупредит в лог. Смена перца гасит невыданные приглашения.
      INVITE_PEPPER: ${INVITE_PEPPER:-}
      # Аварийная привязка сотрудника по @username. Ник в Telegram
      # освобождается после смены, и занявший его получит чужую карточку —
      # штатный путь это одноразовое приглашение. "0" выключает совсем.
      STAFF_LINK_BY_USERNAME: ${STAFF_LINK_BY_USERNAME:-1}
      # Память: индекс прошлых разговоров. Готовится отдельно и только читается.
      # Пусто → поиск по разговорам выключен, заметки работают как обычно.
      HISTORY_DB_PATH: ${HISTORY_DB_PATH:-}
      HISTORY_MODEL_DIR: ${HISTORY_MODEL_DIR:-/data/history/models}
      # Этап 1 миграции: чтение продаж из mydon-stock (пользователь только-чтение).
      # Пусто → синк продаж выключен, панель показывает «появится после сбора».
      STOCK_DATABASE_URL: ${STOCK_DATABASE_URL:-}
      # Хранилище файлов: S3/MinIO при заданных ключах, иначе локальный том ниже.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/data/attachments}
    volumes:
      # Только чтение: MYDON не должен менять индекс разговоров.
      - /opt/mydon-data/history:/data/history:ro
      # Вложения (фото/чеки), когда S3 не настроен — переживают пересборку.
      - /opt/mydon-data/attachments:/data/attachments
      # Сиды и выгрузки — из рабочей копии репозитория, а не из образа:
      # обновление данных сводится к `git pull`, без пересборки и рестарта.
      # Только чтение: импортёры данные читают, писать в них некому.
      - ../data:/app/data:ro
    command: ["node", "apps/core/dist/main.js"]
    networks:
      - default
      - stock
    # Порт только в сети Tailscale, не в интернет:
    ports:
      - "127.0.0.1:3001:3001"

  mydon-bot:
    image: mydon:latest
    container_name: mydon-bot
    restart: unless-stopped
    depends_on:
      - mydon-core
    environment:
      NODE_ENV: production
      TZ: Asia/Tashkent
      CORE_API_URL: http://mydon-core:3001
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      # LLM-слой помощника (FR-4): подписка Claude и/или API-ключ.
      # Пусто и то и другое → бот работает по правилам.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MYDON_ASSISTANT_MODEL: ${MYDON_ASSISTANT_MODEL:-}
    command: ["node", "apps/bot/dist/index.js"]

  mydon-agents:
    image: mydon:latest
    container_name: mydon-agents
    restart: unless-stopped
    depends_on:
      - mydon-core
    environment:
      NODE_ENV: production
      TZ: Asia/Tashkent
      CORE_API_URL: http://mydon-core:3001
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      # Порог автономии: T0 — агенты только предлагают (ответ владельца Ф6)
      AGENT_AUTONOMY_MAX: ${AGENT_AUTONOMY_MAX:-T0}
      AGENTS_SCHEDULES_PAUSED: ${AGENTS_SCHEDULES_PAUSED:-1}
      # Потолок действий на агента и период опроса задач.
      AGENT_DAILY_ACTION_CAP: ${AGENT_DAILY_ACTION_CAP:-50}
      AGENT_TASK_INTERVAL_MS: ${AGENT_TASK_INTERVAL_MS:-60000}
      # Монитор графиков обслуживания: ставит задачи на подходящие к сроку
      # работы. 06:00 — ДО дайджеста сотрудникам (07:00) и брифинга владельца
      # (07:30): к моменту рассылки задачи уже должны стоять. "off" выключает.
      MAINTENANCE_MONITOR_CRON: ${MAINTENANCE_MONITOR_CRON:-0 6 * * *}
      # Сбор Ourvend (ourvend:sync): планограмма и продажи автоматов раз в 3
      # часа. Пустые учётные данные → сбор молча выключен (ourvendConfigFromEnv
      # возвращает null). Переменных здесь не было вовсе, поэтому включить сбор
      # через .env было нельзя: что бы владелец туда ни положил, контейнер
      # этого не видел. Без сбора не обновляется machine_slot и не пишется
      # slot_snapshot — а на нём стоит сверка заливки (WAREHOUSE_SPEC §4.4).
      OURVEND_ACCOUNT: ${OURVEND_ACCOUNT:-}
      OURVEND_PASSWORD: ${OURVEND_PASSWORD:-}
      OURVEND_GROUP_ID: ${OURVEND_GROUP_ID:-}
      OURVEND_SYNC_CRON: ${OURVEND_SYNC_CRON:-0 */3 * * *}
      # Бюджет: subscription — метрируемых трат нет, потолок спит.
      AGENT_BILLING_MODE: ${AGENT_BILLING_MODE:-subscription}
      AGENT_DAILY_BUDGET_USD: ${AGENT_DAILY_BUDGET_USD:-5}
      AGENT_GLOBAL_BUDGET_USD: ${AGENT_GLOBAL_BUDGET_USD:-5}
      # Мозг агентов (см. docs/AGENTS_ACTIVATION.md). Всё пусто → LLM-путь спит,
      # навыки детерминированы. Подписка (claude-cli/codex-cli/gemini-cli) требует
      # ещё и сам CLI в образе + его авторизацию; HTTP-путь — только в Tailscale.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
      LLM_CLI_CMD: ${LLM_CLI_CMD:-}
      LLM_CLI_BASE_ARGS: ${LLM_CLI_BASE_ARGS:-}
      LLM_CLI_PROMPT_VIA: ${LLM_CLI_PROMPT_VIA:-}
      LLM_CLI_MODEL_FLAG: ${LLM_CLI_MODEL_FLAG:-}
      # Семантическая память (RAG, #6b). Пусто → память спит (дельта-память
      # по сигнатуре остаётся). Держать endpoint только в Tailscale.
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      # Notion: отчёты агентов туда, куда владелец и так смотрит.
      # Пусто → агенты работают, но в Notion не пишут.
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_PARENT_PAGE_ID: ${NOTION_PARENT_PAGE_ID:-}
    command: ["node", "apps/agents/dist/index.js"]

  # Веб-панель (оболочка Command Center). Наружу не публикуется:
  # только 127.0.0.1 — доступ через Tailscale, как требует ТЗ §6.
  mydon-cc:
    image: mydon:latest
    container_name: mydon-cc
    restart: unless-stopped
    depends_on:
      - mydon-core
    working_dir: /app/apps/cc
    environment:
      NODE_ENV: production
      TZ: Asia/Tashkent
      PORT: 3002
      HOSTNAME: 0.0.0.0
      CORE_API_URL: http://mydon-core:3001
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      # Приём выгрузок файлом с экрана «Источники». Ключ тот же, что у Core:
      # оболочка кладёт строки тем же приёмом, что и скрипт, и правила у всех
      # одни. Пусто → загрузка файлом выключена, и экран об этом говорит.
      INGEST_KEY: ${INGEST_KEY:-}
      # Имя бота без @ — панель собирает из него ссылку-приглашение.
      # Пусто → ссылка выйдет как https://t.me/?start=inv_… и не откроется.
      # Сам бот спрашивает имя у Telegram при старте и это значение не читает.
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # LLM-слой помощника (FR-4): подписка Claude и/или API-ключ.
      # Пусто и то и другое → панель отвечает по правилам.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MYDON_ASSISTANT_MODEL: ${MYDON_ASSISTANT_MODEL:-}
    command: ["node_modules/.bin/next", "start", "-p", "3002"]
    # Панель нужна владельцу с телефона и компьютера — значит адрес Tailscale,
    # а не только localhost. В интернет (eth0) порт по-прежнему не смотрит:
    # PANEL_BIND задаёт конкретный интерфейс. По умолчанию — localhost, чтобы
    # случайная выкладка без .env не открыла панель шире, чем задумано.
    ports:
      - "${PANEL_BIND:-127.0.0.1}:3002:3002"

networks:
  default:
  # Сеть mydon-stock: Core читает оттуда продажи. Сеть уже существует —
  # мы к ней только присоединяемся, ничего в ней не меняя.
  stock:
    external: true
    name: mydon-stock_default

volumes:
  mydon-db-data:
