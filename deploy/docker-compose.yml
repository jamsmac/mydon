# MYDON на MYDON/OS (Hetzner + Tailscale).
# Портов наружу не открываем: Core слушает только локально, бот работает
# через long polling. Это требование ТЗ §6.
#
# Запуск:  docker compose -f deploy/docker-compose.yml --env-file .env up -d --build

# ПОТОЛОК ЖУРНАЛОВ КОНТЕЙНЕРОВ. Дефолт docker — json-file БЕЗ ограничения:
# логи растут, пока не кончится диск, а его на хосте 38 ГБ и уже ~70 % занято.
# `deploy/guards/disk_guard.sh` о заполнении сообщит, но потолка не поставит, а
# `docker logs mydon-core` — штатный инструмент рунбука (docs/CUTOVER.md), то
# есть журналы должны быть, просто не бесконечные. 20 МБ × 5 файлов на сервис.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # Локальная rollback/recovery БД. В production Core может использовать
  # внешний managed PostgreSQL через DATABASE_URL, но этот контейнер сохраняем
  # для быстрого отката и изолированных восстановлений.
  mydon-db:
    image: postgres:17-alpine
    container_name: mydon-db
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mydon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-mydon}
      TZ: Asia/Tashkent
    volumes:
      - mydon-db-data-v17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mydon} -d ${POSTGRES_DB:-mydon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Наружу не публикуем: доступ только внутри сети compose.

  mydon-core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: mydon:latest
    container_name: mydon-core
    logging: *logging
    restart: unless-stopped
    init: true
    depends_on:
      mydon-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Tashkent
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL обязателен}
      INGEST_KEY: ${INGEST_KEY:-}
      # Внутренний токен доступа к мутациям Core. Один и тот же у Core и клиентов
      # (панель/бот/агенты). Пусто → ВСЕ мутации отклоняются 401 (fail-closed),
      # Core предупреждает на старте.
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      # Второй секрет «второго пояса» owner-only операций. Держат Core и CC
      # (панель), Bot/Agents его НЕ получают. До P5 применялся только к снятию
      # LLM replay-блока; с P5 им же CC подтверждает approvals/роли/автономию.
      OWNER_ACTION_TOKEN: ${OWNER_ACTION_TOKEN:-}
      # P5 web-identity (R-P5-2/4/5/6). Один флаг гейтит И GET личного контура,
      # И owner-only мутации (approvals/роли/автономия) под второй пояс. Core
      # заголовку serve НЕ доверяет — только OWNER_ACTION_TOKEN (заголовок читает
      # лишь CC за serve). ШТАТНЫЙ включатель — тумблер панели «Система» (DB,
      # config-spec); ЭТА env — АВАРИЙНЫЙ kill-switch: "0" ВСЕГДА выключает
      # ужесточение, даже если в базе стоит "1" (чтобы ошибка настройки не
      # заперла владельца). ПУСТО (default) → решает база/дефолт = выкл: мерж
      # среза поведение прода не меняет. НЕ ставить сюда "0" по умолчанию — это
      # заблокировало бы тумблер панели.
      OWNER_IDENTITY_ENFORCED: ${OWNER_IDENTITY_ENFORCED:-}
      # Зарезервировано под будущее раздельное ужесточение чтения. Текущая
      # сборка гейтит чтение personal тем же OWNER_IDENTITY_ENFORCED (см. выше);
      # эта переменная кодом пока не читается. Пусто → без эффекта.
      OWNER_READS_ENFORCED: ${OWNER_READS_ENFORCED:-}
      # Core повторно проверяет потолок атомарно в commit agent outcome.
      AGENT_DAILY_ACTION_CAP: ${AGENT_DAILY_ACTION_CAP:-50}
      # Core возвращает панели effective значения env; DB-настройки
      # остаются сильнее. Agents получает те же defaults ниже.
      AGENTS_SCHEDULES_PAUSED: ${AGENTS_SCHEDULES_PAUSED:-1}
      AGENTS_TASKS_PAUSED: ${AGENTS_TASKS_PAUSED:-1}
      # Единый Core-ledger — единственная денежная граница для всех LLM-клиентов.
      # Несекретный профиль нужен Core и для UI, и для единого admission policy.
      # API key намеренно остаётся только у Agents и сюда не передаётся.
      LLM_ENABLED: ${LLM_ENABLED:-0}
      LLM_ROUTE: ${LLM_ROUTE:-openai-api}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-sol}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_PRICE_PROVIDER_ID: ${LLM_PRICE_PROVIDER_ID:-openai}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
      # Пустой новый ключ сохраняет явный legacy cap существующей установки;
      # при отсутствии обоих Core использует новый fallback $10.
      LLM_GLOBAL_DAILY_BUDGET_USD: ${LLM_GLOBAL_DAILY_BUDGET_USD:-}
      LLM_MAX_RESERVATION_USD: ${LLM_MAX_RESERVATION_USD:-3}
      AGENT_GLOBAL_BUDGET_USD: ${AGENT_GLOBAL_BUDGET_USD:-}
      AGENT_DAILY_BUDGET_USD: ${AGENT_DAILY_BUDGET_USD:-5}
      # Только агрегированный read-only обзор producer-side settlement spool.
      LLM_LEDGER_OUTBOX_ROOT: /data/llm-close
      # Перец для хешей приглашений сотрудников. В БД лежит только хеш кода;
      # без перца 47 бит кода предвычисляются радужной таблицей один раз, и
      # утёкший дамп staff_invite становится пачкой рабочих приглашений.
      # Пусто → Core поднимется (обновление не должно ронять живой сервер),
      # но предупредит в лог. Смена перца гасит невыданные приглашения.
      INVITE_PEPPER: ${INVITE_PEPPER:-}
      # Аварийная привязка сотрудника по @username. Ник в Telegram
      # освобождается после смены, и занявший его получит чужую карточку —
      # штатный путь это одноразовое приглашение. По умолчанию выключено;
      # "1" разрешают только временно для аварийной первичной привязки.
      STAFF_LINK_BY_USERNAME: ${STAFF_LINK_BY_USERNAME:-0}
      HEALTH_STORAGE_PATH: ${HEALTH_STORAGE_PATH:-/}
      HEALTH_MIN_STORAGE_MB: ${HEALTH_MIN_STORAGE_MB:-1024}
      # Память: индекс прошлых разговоров. Готовится отдельно и только читается.
      # Пусто → поиск по разговорам выключен, заметки работают как обычно.
      HISTORY_DB_PATH: ${HISTORY_DB_PATH:-}
      HISTORY_MODEL_DIR: ${HISTORY_MODEL_DIR:-/data/history/models}
      # Этап 1 миграции: чтение продаж из mydon-stock (пользователь только-чтение).
      # Пусто → синк продаж выключен, панель показывает «появится после сбора».
      STOCK_DATABASE_URL: ${STOCK_DATABASE_URL:-}
      # П2 поглощения mydon-stock: источник учётного потока OurVend.
      # "stock" (по умолчанию) — чтение БД склада; "own" — собственный снапшот
      # (переключать после 7 зелёных дней GET /ourvend/parity).
      # П8b: фолбэк под настройкой панели «Система» (system_config, база
      # важнее env). Действующее значение и рунбук флипа — docs/CUTOVER.md.
      # Без STOCK_DATABASE_URL игнорируется — действует own.
      OURVEND_ACCOUNTING_SOURCE: ${OURVEND_ACCOUNTING_SOURCE:-stock}
      # Пороги катовера (П8b) — панель «Система» (system_config), СЮДА НЕ
      # ПРОБРОШЕНЫ: CUTOVER_GREEN_DAYS (7), STOCK_PARITY_TOLERANCE (3, ≥0,
      # допуск сверки остатков — 15-минутный разрыв между съёмом зеркала
      # 07:50 и агента 08:05), SNAPSHOT_STALE_HOURS (36), SNAPSHOT_RETENTION_DAYS
      # (180, панель не примет ниже 90). Дефолты — apps/core/src/system/config-spec.ts.
      # П5a: маршрут загрузки автоматов для плана закупа (серийники через
      # запятую). Пусто → по имени автомата. Правится и из панели настроек
      # (база важнее env).
      VENDING_ROUTE_ORDER: ${VENDING_ROUTE_ORDER:-}
      # Хранилище файлов: S3/MinIO при заданных ключах, иначе локальный том ниже.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/data/attachments}
    volumes:
      # Только чтение: MYDON не должен менять индекс разговоров.
      - /opt/mydon-data/history:/data/history:ro
      # Вложения (фото/чеки), когда S3 не настроен — переживают пересборку.
      - /opt/mydon-data/attachments:/data/attachments
      # Settlement spool создают Bot/CC/Agents; Core только считает агрегаты.
      - /opt/mydon-data/llm-close:/data/llm-close:ro
      # Сиды и выгрузки — из рабочей копии репозитория, а не из образа:
      # обновление данных сводится к `git pull`, без пересборки и рестарта.
      # Только чтение: импортёры данные читают, писать в них некому.
      - ../data:/app/data:ro
    command: ["node", "apps/core/dist/main.js"]
    # ЗДОРОВЬЕ ЯДРА — ТАКОЕ ЖЕ, КАК У STANDBY (docker-compose.standby.yml).
    # Без него `depends_on: mydon-core` у бота, агентов и панели ждал только
    # СТАРТА процесса, а не готовности: воркеры успевали дёрнуть Core до того,
    # как он поднял БД и крон, и `docker ps` (его читает deploy/heartbeat.sh)
    # никогда не показывал приложения как (healthy).
    # READINESS, а не строгое здоровье: любой HTTP-ответ (200 ok / 503
    # degraded) означает «Nest поднялся, API отвечает» — воркеры могут
    # стартовать и ретраить. Требование status==='ok' здесь (degraded = 503,
    # см. health.controller.ts) роняло бы рунбучный `docker compose ... up -d`
    # через ~65с «dependency failed to start» ровно во время
    # degraded-инцидента (диск ниже HEALTH_MIN_STORAGE_MB — реальный сценарий
    # при 38 ГБ ~70%), когда панель нужнее всего. Строгий 'ok' остаётся
    # заботой health-fence деплоя (auto-deploy.sh шаг 6) и heartbeat.sh.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(()=>process.exit(0)).catch(()=>process.exit(1))
      # Частые пробы нужны только на старте: start_interval даёт 3s внутри
      # start_period, а установившийся режим не гоняет node каждые 5 секунд.
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 3s
    networks:
      - default
      - stock
    # Порт только в сети Tailscale, не в интернет:
    ports:
      - "127.0.0.1:3001:3001"

  mydon-bot:
    image: mydon:latest
    container_name: mydon-bot
    logging: *logging
    restart: unless-stopped
    init: true
    depends_on:
      mydon-core:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Tashkent
      CORE_API_URL: http://mydon-core:3001
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      # LLM-слой помощника (FR-4): подписка Claude и/или API-ключ.
      # Пусто и то и другое → бот работает по правилам.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MYDON_ASSISTANT_MODEL: ${MYDON_ASSISTANT_MODEL:-}
      LLM_LEDGER_OUTBOX_ROOT: /data/llm-close
    volumes:
      # Exact accounting intent переживает restart/recreate контейнера.
      - /opt/mydon-data/llm-close/bot:/data/llm-close/bot
    command: ["node", "apps/bot/dist/index.js"]

  mydon-agents:
    image: mydon:latest
    container_name: mydon-agents
    logging: *logging
    restart: unless-stopped
    init: true
    depends_on:
      mydon-core:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Tashkent
      CORE_API_URL: http://mydon-core:3001
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      # Порог автономии: T0 — агенты только предлагают (ответ владельца Ф6)
      AGENT_AUTONOMY_MAX: ${AGENT_AUTONOMY_MAX:-T0}
      # Две независимые паузы: cron и task-worker через Core.
      AGENTS_SCHEDULES_PAUSED: ${AGENTS_SCHEDULES_PAUSED:-1}
      AGENTS_TASKS_PAUSED: ${AGENTS_TASKS_PAUSED:-1}
      # Потолок действий на агента и период опроса задач.
      AGENT_DAILY_ACTION_CAP: ${AGENT_DAILY_ACTION_CAP:-50}
      AGENT_TASK_INTERVAL_MS: ${AGENT_TASK_INTERVAL_MS:-60000}
      # llm-навыки (executor: llm): потолок символов одной KB-страницы в
      # контексте модели. Пусто → 12000 (см. docs/AGENTS_ACTIVATION.md, 1г).
      LLM_SKILL_KB_PAGE_CHARS: ${LLM_SKILL_KB_PAGE_CHARS:-}
      LLM_LEDGER_OUTBOX_ROOT: /data/llm-close
      # Монитор графиков обслуживания: ставит задачи на подходящие к сроку
      # работы. 06:00 — ДО дайджеста сотрудникам (07:00) и брифинга владельца
      # (07:30): к моменту рассылки задачи уже должны стоять. "off" выключает.
      MAINTENANCE_MONITOR_CRON: ${MAINTENANCE_MONITOR_CRON:-0 6 * * *}
      # Сбор Ourvend (ourvend:sync): планограмма и продажи автоматов раз в 3
      # часа. Пустые учётные данные → сбор молча выключен (ourvendConfigFromEnv
      # возвращает null). Переменных здесь не было вовсе, поэтому включить сбор
      # через .env было нельзя: что бы владелец туда ни положил, контейнер
      # этого не видел. Без сбора не обновляется machine_slot и не пишется
      # slot_snapshot — а на нём стоит сверка заливки (WAREHOUSE_SPEC §4.4).
      OURVEND_ACCOUNT: ${OURVEND_ACCOUNT:-}
      OURVEND_PASSWORD: ${OURVEND_PASSWORD:-}
      OURVEND_GROUP_ID: ${OURVEND_GROUP_ID:-}
      OURVEND_SYNC_CRON: ${OURVEND_SYNC_CRON:-0 */3 * * *}
      # Приём вендинга — одна транзакция Core на сотни строк; обычный таймаут
      # агентов (10 с) на внешней базе по TLS её не дожидался, и сбор падал
      # каждые три часа с machines_ok=0 (24.08.2026).
      CORE_INGEST_TIMEOUT_MS: ${CORE_INGEST_TIMEOUT_MS:-60000}
      # Учётный снапшот OurVend (П2 поглощения): суточные продажи + остатки.
      # 08:05 — после съёма stock (07:50), чтобы паритет сверял одни сутки.
      OURVEND_ACCOUNTING_CRON: ${OURVEND_ACCOUNTING_CRON:-5 8 * * *}
      # Мозг Agents (см. docs/AGENTS_ACTIVATION.md). LLM_ENABLED=0 → путь спит.
      # Рабочий default — OpenAI API; Codex subscription остаётся fail-closed.
      LLM_ENABLED: ${LLM_ENABLED:-0}
      LLM_ROUTE: ${LLM_ROUTE:-openai-api}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Не URL/секрет: exact provider из llm_model_price для денежного профиля.
      LLM_PRICE_PROVIDER_ID: ${LLM_PRICE_PROVIDER_ID:-openai}
      # HTTP считается платным и требует Core-ledger. local допустим только
      # для явно бесплатного локального runtime.
      LLM_HTTP_BILLING_MODE: ${LLM_HTTP_BILLING_MODE:-metered}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-sol}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
      # Семантическая память (RAG, #6b). Пусто → память спит (дельта-память
      # по сигнатуре остаётся). Держать endpoint только в Tailscale.
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_PRICE_PROVIDER_ID: ${EMBED_PRICE_PROVIDER_ID:-}
      EMBED_BILLING_MODE: ${EMBED_BILLING_MODE:-metered}
      EMBED_MODEL: ${EMBED_MODEL:-}
      # Notion: отчёты агентов туда, куда владелец и так смотрит.
      # Пусто → агенты работают, но в Notion не пишут.
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_PARENT_PAGE_ID: ${NOTION_PARENT_PAGE_ID:-}
    volumes:
      # Agents пишет свой spool и единолично дренит все producer-каталоги.
      - /opt/mydon-data/llm-close:/data/llm-close
    command: ["node", "apps/agents/dist/index.js"]

  # Веб-панель (оболочка Command Center). Наружу не публикуется:
  # только 127.0.0.1 — доступ через Tailscale, как требует ТЗ §6.
  mydon-cc:
    image: mydon:latest
    container_name: mydon-cc
    logging: *logging
    restart: unless-stopped
    init: true
    depends_on:
      mydon-core:
        condition: service_healthy
    working_dir: /app/apps/cc
    environment:
      NODE_ENV: production
      TZ: Asia/Tashkent
      PORT: 3002
      HOSTNAME: 0.0.0.0
      CORE_API_URL: http://mydon-core:3001
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      # P5 web-identity. CC — единственный, кто читает Tailscale-User-Login
      # (он стоит за `tailscale serve`, см. ports ниже). Owner-only действия CC
      # подтверждает Core этим вторым поясом — ТОЛЬКО когда действие инициировал
      # владелец. Bot/Agents токена не имеют. Core заголовку не доверяет (R-P5-2).
      OWNER_ACTION_TOKEN: ${OWNER_ACTION_TOKEN:-}
      # Логин владельца в tailnet (email). Резолвер сопоставляет с ним заголовок
      # serve. Пусто → владелец не распознаётся; задавать ДО включения флагов.
      OWNER_TAILSCALE_LOGIN: ${OWNER_TAILSCALE_LOGIN:-}
      # ВНИМАНИЕ: у CC этот флаг работает НЕ как у Core. CC тумблер панели (DB)
      # НЕ читает — только env и ТОЛЬКО значение "1" (apps/cc/src/lib/owner.ts:
      # ownerEnforcementEnabled). При "1" CC гейтит роут /domain/personal
      # (notFound/redirect не-владельцу) — это defense-in-depth ПОВЕРХ
      # авторитетного data-гейта Core. Пусто/иное → route-гейт CC ВЫКЛ; personal
      # при этом всё равно защищён 403 самого Core (его включает тумблер панели),
      # так что утечки нет — просто без честного отказа на CC-слое. "0" —
      # kill-switch (как у mydon-core), выключает и Core, и CC. Чтобы поднять и
      # route-гейт CC, поставить "1" ДОПОЛНИТЕЛЬНО к тумблеру панели.
      OWNER_IDENTITY_ENFORCED: ${OWNER_IDENTITY_ENFORCED:-}
      # Зарезервировано (кодом пока не читается), см. mydon-core.
      OWNER_READS_ENFORCED: ${OWNER_READS_ENFORCED:-}
      # Приём выгрузок файлом с экрана «Источники». Ключ тот же, что у Core:
      # оболочка кладёт строки тем же приёмом, что и скрипт, и правила у всех
      # одни. Пусто → загрузка файлом выключена, и экран об этом говорит.
      INGEST_KEY: ${INGEST_KEY:-}
      # Имя бота без @ — панель собирает из него ссылку-приглашение.
      # Пусто → ссылка выйдет как https://t.me/?start=inv_… и не откроется.
      # Сам бот спрашивает имя у Telegram при старте и это значение не читает.
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # LLM-слой помощника (FR-4): подписка Claude и/или API-ключ.
      # Пусто и то и другое → панель отвечает по правилам.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MYDON_ASSISTANT_MODEL: ${MYDON_ASSISTANT_MODEL:-}
      # Подложка карты панели (Leaflet-шаблон с {z}/{x}/{y}, см. .env.example).
      # Пусто → бесключевые тайлы OSM. Этот env-блок — явный белый список:
      # без строки здесь значение из серверного .env в контейнер не попадёт.
      MAP_TILES_URL: ${MAP_TILES_URL:-}
      LLM_LEDGER_OUTBOX_ROOT: /data/llm-close
    volumes:
      # Server actions сначала fsync-ят exact settlement на host.
      - /opt/mydon-data/llm-close/cc:/data/llm-close/cc
    command: ["node_modules/.bin/next", "start", "-p", "3002"]
    # Доступ к панели — через `tailscale serve` (P5, R-P5-2): serve на самом
    # хосте терминирует HTTPS, проставляет доверенный Tailscale-User-Login и
    # проксирует на 127.0.0.1:3002. Поэтому за serve PANEL_BIND ОБЯЗАН быть
    # 127.0.0.1 (loopback) — иначе :3002 доступен напрямую в обход serve и
    # заголовок подделываем. Прямой Tailscale-IP допустим ТОЛЬКО транзитно, до
    # перевода за serve (см. deploy/tailscale-serve-panel.sh, docs/DEPLOY.md).
    # 0.0.0.0 деплой отклоняет (панель ушла бы в интернет, docker-proxy минует ufw).
    # По умолчанию — localhost, чтобы выкладка без .env не открыла панель шире.
    ports:
      - "${PANEL_BIND:-127.0.0.1}:3002:3002"

networks:
  default:
  # Сеть mydon-stock: Core читает оттуда продажи. Сеть уже существует —
  # мы к ней только присоединяемся, ничего в ней не меняя.
  stock:
    external: true
    name: mydon-stock_default

volumes:
  # Prepared from a verified portable production dump during the PG17 cutover.
  # The former deploy_mydon-db-data (PG16) volume is retained outside Compose
  # and must never be removed by an ordinary deploy.
  mydon-db-data-v17:
