name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tashkent
    services:
      # Версия та же, что у managed production (Postgres 17): проверять на
      # другой значит проверять не то, что поедет в бой.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mydon
          POSTGRES_PASSWORD: mydon
          POSTGRES_DB: mydon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mydon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Тесты гоняются по собранному dist/**/*.test.js, поэтому строго после build.
      - name: Test
        run: pnpm -r --if-present test

      # Дымовой прогон Core против НАСТОЯЩЕГО постгреса.
      #
      # Юнит-тесты не исполняют SQL: заглушка БД возвращает заготовленный ответ
      # на любой запрос и зеленеет на любом синтаксисе. Шаг ниже проверяет
      # только миграции. Весь сырой SQL в сервисах до сих пор был покрыт лишь
      # живым прогоном — и 07.08.2026 это стоило прода: `coilId <> all(${массив})`
      # в уборке слотов дал 500 на приёме, потому что Drizzle разворачивает
      # JS-массив в список плейсхолдеров, а Postgres требует массив.
      #
      # Шаг поднимает Core, дожидается health и дёргает пути, каждый из которых
      # доходит до базы, включая приём слотов с уборкой.
      - name: Smoke (Core против настоящего postgres)
        env:
          DATABASE_URL: postgresql://mydon:mydon@127.0.0.1:5432/mydon
          SERVICE_TOKEN: smoke-token
        run: |
          pnpm --filter @mydon/db db:migrate
          node packages/db/dist/seed.js
          # Прайс вендинга — не украшение прогона: без карточек товаров
          # `product_id` в слотах и на складе всегда NULL, и сценарий «повторный
          # апсерт не затирает ссылку» (П4) проверял бы null против null.
          node packages/db/dist/seed-vending.js
          # Разовый бэкфилл product_id (П4, R-FW-4): закрепляет сценарий
          # «UPDATE трогает только product_id IS NULL» (N2) против настоящего
          # Postgres, а не заглушки.
          node packages/db/dist/backfill-product-ids.js
          # Разовый импорт истории склада (П8a, R-P8a-8) против настоящего
          # Postgres: заглушка drizzle не исполняет `on conflict (source,
          # ext_id) where ext_id is not null` — предикат ЧАСТИЧНОГО индекса, —
          # и не доказывает идемпотентность. Шаг заводит фикстурного донора в
          # схеме `stock_donor` той же базы, гоняет --dry-run и --apply дважды
          # и убирает за собой. Идёт ДО smoke-core.mjs: тот намеренно гасит
          # STOCK_DATABASE_URL и о доноре знать не должен.
          #
          # SMOKE_SCRATCH=1 — явное согласие на запись (R-FW-S4): прогон пишет в
          # базу и без этого флага работает только на базе со словом «smoke» в
          # имени. База CI называется mydon, поэтому согласие даётся здесь — и
          # ровно на одну команду, а не на весь шаг.
          SMOKE_SCRATCH=1 node tools/smoke-import.mjs
          # Та же застава у smoke-core.mjs (R-FW-S9): он тоже ПИШЕТ — заводит
          # фикстурные автоматы, свои пересчёты склада, заявки и приёмки, — а
          # проверял до сих пор ноль условий. База CI называется mydon, поэтому
          # согласие даётся здесь и ровно на одну команду.
          SMOKE_SCRATCH=1 node tools/smoke-core.mjs

      # Дымовой прогон ПАНЕЛИ: страницы должны отдаваться, а не падать в 500.
      #
      # `next build` страницы с `force-dynamic` не отрисовывает — только
      # компилирует, поэтому целый класс ошибок сборка не видит. 08.08.2026 так
      # ушла на прод `/places`: Leaflet трогает `window` при вычислении модуля,
      # а `"use client"` серверный рендер не отменяет. Типы тут тоже бессильны —
      # как и с несуществующими CSS-классами до этого.
      #
      # Core поднимается прямо в шаге: панель без него отдаёт экран «Core
      # недоступен» с кодом 200, и проверка стала бы бессмысленной.
      - name: Smoke (панель отдаёт страницы)
        # Предел жёсткий: шаг уже дважды висел, а висящий шаг жжёт минуты
        # задания молча и выглядит как «ещё идёт», а не как провал.
        timeout-minutes: 8
        env:
          DATABASE_URL: postgresql://mydon:mydon@127.0.0.1:5432/mydon
          SERVICE_TOKEN: smoke-token
          CORE_API_URL: http://127.0.0.1:3099
        run: |
          # Вывод фонового Core уводим в файл и закрываем ему stdin.
          # Иначе шаг не завершится НИКОГДА: GitHub Actions ждёт закрытия
          # трубы лога, а фоновый процесс держит её открытой — команда уже
          # отработала, а шаг висит до таймаута задания.
          PORT=3099 node apps/core/dist/main.js >/tmp/core-smoke.log 2>&1 </dev/null &
          CORE_PID=$!
          trap 'kill $CORE_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf --max-time 2 http://127.0.0.1:3099/health >/dev/null && break
            sleep 1
          done
          if ! curl -sf --max-time 5 http://127.0.0.1:3099/health >/dev/null; then
            echo "Core не поднялся, последние строки лога:"
            tail -30 /tmp/core-smoke.log
            exit 1
          fi
          node tools/smoke-panel.mjs

      # Миграции против НАСТОЯЩЕГО постгреса. Юнит-тесты этого класса ошибок
      # не ловят в принципе: SQL проверяет только сервер. Так три дня прожила
      # 0042 с `coalesce(part_kind::text,'')` — `drizzle-kit push` на пустой
      # базе разработчика её принимал, а `migrate` на сервере падал с 42P17
      # («functions in index expression must be marked IMMUTABLE»), и полевой
      # контур не разворачивался. Шаг прогоняет ВСЮ цепочку с нуля.
      - name: Migrations (real postgres)
        env:
          DATABASE_URL: postgresql://mydon:mydon@127.0.0.1:5432/mydon
        run: pnpm --filter @mydon/db db:migrate

      # Чистая цепочка выше не доказывает переход существующей базы. Этот шаг
      # поднимает отдельную БД на 0061, кладёт граничные данные и дважды гоняет
      # текущий мигратор: сначала upgrade, затем обязательный no-op.
      - name: Migration upgrade (0061 to 0062)
        env:
          DATABASE_URL: postgresql://mydon:mydon@127.0.0.1:5432/mydon
        run: node packages/db/dist/migration-0062.integration.js

      # Раньше continue-on-error:true молча прятал 5 high-уязвимостей —
      # шаг всегда зеленел, даже когда pnpm audit падал кодом 1 (найдено
      # внешним аудитом, P1). Теперь high/critical реально блокируют CI;
      # транзитивные versions зафиксированы через pnpm.overrides в корневом
      # package.json (adm-zip/sharp/postcss/brace-expansion).
      - name: Audit (high+)
        run: pnpm audit --audit-level high

      - name: Operations scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          bash -n deploy/guards/*.sh deploy/*.sh deploy/tests/*.sh
          shellcheck deploy/guards/db_access.sh deploy/guards/b2_offsite.sh \
            deploy/guards/backup_extra.sh deploy/restore_test_mydon.sh \
            deploy/guards/disk_guard.sh deploy/guards/healthz_guard.sh \
            deploy/deploy.sh deploy/auto-deploy.sh deploy/setup-b2-offsite.sh \
            deploy/setup-guards.sh \
            deploy/b2-recovery-drill-macos.sh deploy/standby-lib.sh \
            deploy/standby-drill.sh \
            deploy/standby-promote.sh deploy/standby-stop.sh \
            deploy/tests/fake-rclone.sh deploy/tests/fake-docker-db.sh \
            deploy/tests/b2-offsite.test.sh deploy/tests/db-access.test.sh \
            deploy/tests/standby-compose.test.sh \
            deploy/watchdog-liveness.sh deploy/deploy-failure-alert.sh \
            deploy/tests/auto-deploy-gate.test.sh deploy/tests/watchdog-liveness.test.sh \
            deploy/tests/fake-crontab.sh deploy/tests/setup-guards.test.sh \
            deploy/tests/guards-env.test.sh
          bash deploy/tests/db-access.test.sh
          bash deploy/tests/b2-offsite.test.sh
          bash deploy/tests/standby-compose.test.sh
          bash deploy/tests/auto-deploy-gate.test.sh
          bash deploy/tests/watchdog-liveness.test.sh
          bash deploy/tests/setup-guards.test.sh
          bash deploy/tests/guards-env.test.sh
